name: Build mod APK v4
on: workflow_dispatch
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v5
      - name: Prepare Unity project (game archive + mod files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download game-base --pattern game.zip --repo "${{ github.repository }}"
          mkdir game
          unzip -q game.zip -d game
          rm game.zip
          # 1) ищем ProjectVersion.txt (самый неглубокий)
          VER=$(find game -name ProjectVersion.txt -path "*ProjectSettings*" -not -path "*__MACOSX*" | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$VER" ]; then
            PROJ=$(dirname "$(dirname "$VER")")
          else
            # 2) ProjectVersion.txt нет (часто у декомпила) — ищем папку Assets и создаём файл сами
            ASSETS=$(find game -type d -name Assets -not -path "*__MACOSX*" | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
            if [ -z "$ASSETS" ]; then
              echo "::error::В архиве игры нет папки Assets. Загрузите zip, в котором лежат папки Assets, Packages и ProjectSettings."
              find game -maxdepth 3 | head -60
              exit 1
            fi
            PROJ=$(dirname "$ASSETS")
            mkdir -p "$PROJ/ProjectSettings"
            printf 'm_EditorVersion: 2018.3.9f1\nm_EditorVersionWithRevision: 2018.3.9f1 (0)\n' > "$PROJ/ProjectSettings/ProjectVersion.txt"
            echo "::warning::ProjectVersion.txt не найден в архиве игры — создан вручную (Unity 2018.3.9f1)."
          fi
          # Всегда перекладываем проект в фиксированную папку UnityProject
          mv "$PROJ" UnityProject
          rm -rf game
          if [ ! -d mod ]; then echo "::error::В репозитории нет папки mod (файлы мода не отправлены)"; exit 1; fi
          cp -r mod/. UnityProject/
          echo "Unity project folder:"
          ls UnityProject
          cat UnityProject/ProjectSettings/ProjectVersion.txt
      - uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-mod-${{ github.run_number }}
          restore-keys: Library-mod-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: UnityProject
          unityVersion: auto
          targetPlatform: Android
          buildMethod: BaldiMod.ModTools.BuildAll
          allowDirtyBuild: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          name: Mod build ${{ github.run_number }}
          files: build/Android/mod.apk
