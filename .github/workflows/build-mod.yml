name: Build mod APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-mod-${{ github.run_number }}
          restore-keys: Library-mod-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: auto
          targetPlatform: Android
          buildMethod: BaldiMod.ModTools.BuildAll
          allowDirtyBuild: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          name: Mod build ${{ github.run_number }}
          files: build/Android/mod.apk
